version: "3.9"

services:
  api:
    image: sierra/api
    restart: always
    volumes:
      - ./api:/var/www/html
    env_file:
      - "./api/.env"
    environment:
      - "APP_ENV=${APP_ENV:-dev}"
    networks:
      - internal
    logging:
      options:
        max-size: "10m"
        max-file: "10"

  cron:
    image: sierra/cron
    restart: always
    volumes:
      - ./api:/var/www/html
    env_file:
      - "./api/.env"
    environment:
      - "APP_ENV=${APP_ENV:-dev}"
    networks:
      - internal
    logging:
      options:
        max-size: "10m"
        max-file: "10"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/error_responses.conf:/etc/nginx/error_responses.conf
      - "./infrastructure/nginx/environment/${APP_ENV:-dev}/default.conf:/etc/nginx/conf.d/default.conf"
      - "./infrastructure/nginx/environment/${APP_ENV:-dev}/php-fpm.conf:/etc/nginx/php-fpm.conf"
    networks:
      - internal
    logging:
      options:
        max-size: "10m"
        max-file: "10"

  database:
    image: postgres:16.2
    env_file:
      - "./api/.env" # get the environment variables from a file
    volumes:
      - database-data:/var/lib/postgresql/data:rw # persist data even if container shuts down
    ports:
      - "5432:5432"
    networks:
      - internal
    logging:
      options:
        max-size: "10m"

volumes:
  # Database data persistence
  database-data:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: "172.22.0.0/16"  # Specify the subnet for the network