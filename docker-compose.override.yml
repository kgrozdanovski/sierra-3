# Warning: Do not deploy this file to production!
version: "3.9"

services:
  api:
    volumes:
      # Mount here instead of in Dockerfile for simpler setting changes during development
      - "./infrastructure/api/environment/${APP_ENV:-dev}/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini"
    expose:
      - "127.0.0.1:9003:9003" # Bind port 9003 for xDebug
      - "127.0.0.1:9000:9000" # Bind port 9000 for FastCGI pass
    networks:
      internal:
        aliases:
          - api.sierra.local

  cron:
    expose:
      - "127.0.0.1:9003:9003" # Bind port 9003 for xDebug
      - "127.0.0.1:9000:9000" # Bind port 9000 for FastCGI pass

  nginx:
    volumes:
      # Self-signed SSL certificates are used only in the development environment
      - "./infrastructure/nginx/environment/${APP_ENV:-dev}/ssl:/etc/nginx/ssl"
    extra_hosts:
      - "api.sierra.local:127.0.0.1"
      - "db.sierra.local:127.0.0.1"

  database:
    command: [ "postgres", "-c", "log_statement=all", "-c", "log_destination=stderr" ]
    networks:
      internal:
        aliases:
          - db.sierra.local

  test:
    image: sierra/test
    volumes:
      - ./:/var/www/html
      # Do not override the `api/vendor` directory
      - /var/www/html/api/vendor
    environment:
      - "APP_ENV=${APP_ENV:-dev}"
    networks:
      - internal