security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: sodium
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # Used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: 'App\User\Persistence\Doctrine\Entity\User'
                property: 'email'
    # https://symfony.com/doc/current/security.html#the-firewall
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            # Path is not login
            pattern: ^/(?!login)

            stateless: true

            # The lazy anonymous mode prevents the session from being started if there is no need for authorization
            # (i.e. explicit check for a user privilege). This is important to keep requests cacheable.
            lazy: true

            provider: app_user_provider

            # Define login controller to handle successful authentication
            json_login:
                # auth_login is a route alias
                check_path: auth_login
                # Resolve the user from these JSON fields in the request
                username_path: email
                password_path: password

            # Rate Limiter (symfony/rate-limiter) configuration

            # Configure the maximum login attempts
            login_throttling:
                max_attempts: 5 # per minute ...
                interval: '15 minutes'

            # Configure the custom Authenticator middleware for the token-based authentication
            custom_authenticators:
                - 'App\Kernel\Business\Security\Authenticator\BearerTokenAuthenticator'

            # Define logout controller to handle successful logout
            logout:
                path: auth_logout

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
