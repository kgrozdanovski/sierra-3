# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    system_user_id: '%env(string:APP_SYSTEM_USER)%'
    # Optimization available when using OPCache
    # @see https://symfony.com/doc/7.0/performance.html#dump-the-service-container-into-a-single-file
    container:
        dumper:
            inline_factories: true

services:
    # Default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $internalUserId: '%system_user_id%'

    _instanceof:
        App\Kernel\Communication\Controller\ControllerInterface:
            tags: [ 'controller.service_arguments' ]

    # Makes classes in src/ available to be used as services
    # This creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Set Argument Value Resolvers
    # Read more: https://symfony.com/doc/current/controller/value_resolver.html#controller-argument-value-resolver
    App\Kernel\Communication\HttpKernel\Controller\ValueObjectResolver:
        tags:
            - controller.argument_value_resolver:
                  priority: 206

    # Register a formatter that uses the extra data from the custom Processors
    monolog.formatter.extended_context:
        class: Monolog\Formatter\LineFormatter
        arguments:
            - "[%%datetime%%] %%channel%%.%%level_name%%: [%%extra.request_id%%] [%%extra.request_method%%] %%extra.request_uri%% FROM %%extra.user_id%%@%%extra.client_ip%% USING %%extra.user_agent%% : %%message%% %%context%%\n"

    # Inject all services tagged with app.kernel.dependency_injection.service_resolver as first argument
    # Read more: https://symfony.com/doc/current/service_container/tags.html#adding-additional-attributes-on-tags
    App\Kernel\Business\ValueObject\ValueObjectSubscriber:
        arguments:
            - !tagged_iterator { tag: app.kernel.dependency_injection.service_resolver }

    # Doctrine Event listeners
    App\Kernel\Persistence\Doctrine\EventListener\CustomGeneratorPrePersistListener:
        tags:
            - { name: 'doctrine.event_listener', event: 'prePersist', priority: 499 }

    App\Kernel\Persistence\Doctrine\EventListener\BlameAuditPrePersistListener:
        tags:
            - { name: 'doctrine.event_listener', event: 'prePersist', priority: 500 }

    App\Kernel\Persistence\Doctrine\EventListener\BlameAuditPreUpdateListener:
        tags:
            - { name: 'doctrine.event_listener', event: 'preUpdate', priority: 500 }

    App\Kernel\Persistence\Doctrine\EventListener\TimestampAuditPrePersistListener:
        tags:
            - { name: 'doctrine.event_listener', event: 'prePersist', priority: 501 }

    App\Kernel\Persistence\Doctrine\EventListener\TimestampAuditPreUpdateListener:
        tags:
            - { name: 'doctrine.event_listener', event: 'preUpdate', priority: 501 }

    App\Kernel\Persistence\Doctrine\EventListener\EntityAuditPostUpdateListener:
        tags:
            - { name: 'doctrine.event_listener', event: 'postUpdate', priority: 500 }