server {
    listen 443 quic reuseport;  # Enable QUIC and HTTP/3
    listen 443 ssl http2;       # TCP fallback for clients that don't support QUIC
    server_name api.sierra.local;

    index index.php index.html;
    root /var/www/html/public;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # SSL configuration
    ssl_certificate     /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;
    ssl_protocols       TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;

    # Also check out 'post_max_size' and 'memory_limit' in php.ini
    client_max_body_size 128M;

    # Increase default request timeout from 60 to 300 seconds
    # Also check 'max_execution_time' in php.ini
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;

    default_type application/json;

    # Include default error response formats
    include error_responses.conf;

    # Advertise that QUIC is available
    add_header Alt-Svc 'h3=":$server_port"; ma=86400';

    location /api/ {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;

        rewrite ^/api/?(.*) /index.php break;

        # Security configuration
        allow 172.22.0.0/16;  # Adjust this to match the Docker network's CIDR
        deny all;  # Deny all other /api requests from outside the Docker network

        location /api/public/ {
            rewrite ^/api/?(.*) /index.php break;   # Is not inherited from the parent location block
            allow all;  # Allow all requests to /api/public

            include php-fpm.conf;   # Is not inherited from the parent location block
        }

        include php-fpm.conf;
    }

    # Return 404 for all other php files not matching the front controller.
    # This prevents access to other php files you don't want to be accessible.
    location ~ \.php$ {
        return 404;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}

server {
    listen 80;
    server_name api.sierra.local;

    # Permanent redirect which preserves the request method
    return 308 https://$host$request_uri;
}