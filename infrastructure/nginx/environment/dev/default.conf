server {
    server_name api.sierra.local;

    index index.php index.html;
    root /var/www/html/public;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Also check out 'post_max_size' and 'memory_limit' in php.ini
    client_max_body_size 128M;

    # Increase default request timeout from 60 to 300 seconds
    # Also check 'max_execution_time' in php.ini
    proxy_read_timeout 300;
    proxy_connect_timeout 300;
    proxy_send_timeout 300;

    location /api {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;
        proxy_set_header X-NginX-Proxy true;

        rewrite ^/api/?(.*) /index.php break;

        include php-fpm.conf;
    }

    location ~ \.php$ {
        include php-fpm.conf;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }
}